spring.application.name=backend

# Local (non-Docker) runs read the same .env that docker compose uses, so
# `./mvnw spring-boot:run` works without exporting anything by hand.
# `optional:` means startup still succeeds when the file is absent - which is
# the case inside the container, where real env vars supply these instead.
spring.config.import=optional:file:../.env[.properties]

# ---- Datasource ----
# Defaults point at the local docker-compose Postgres. These are not secrets:
# the same values sit in plaintext in docker-compose.yml's POSTGRES_* block.
# Compose overrides the URL with the `postgres` service hostname.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventsphere}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:eventsphere}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:eventsphere}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

# ---- Secrets: deliberately no defaults ----
# A missing value fails startup loudly. A default here would be worse than the
# error: every deployment would silently share one publicly-known signing key,
# letting anyone mint valid tokens for any account.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---- AI ----
# Gemini exposed through its OpenAI-compatible endpoint, which is why these are
# spring.ai.openai.* keys rather than anything Gemini-specific.
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.chat.options.model=${GEMINI_MODEL:gemini-flash-latest}
