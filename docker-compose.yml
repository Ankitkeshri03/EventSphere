services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: eventsphere
      POSTGRES_USER: eventsphere
      POSTGRES_PASSWORD: eventsphere
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # `depends_on` alone only waits for the container to START, not for Postgres
    # to accept connections. Without this healthcheck the backend regularly wins
    # the race and dies on "connection refused".
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventsphere -d eventsphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./eventsphere-backend
    ports:
      - "8080:8080"
    # Every value here is a NAME, never a literal secret - real values come from
    # the gitignored .env, which compose reads automatically from this folder.
    environment:
      # Host is `postgres` (the service name), not `localhost`. Inside a
      # container localhost is that container itself, so localhost:5432 would
      # look for a database inside the backend container and find nothing.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/eventsphere}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-eventsphere}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-eventsphere}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}

      # `${VAR:?...}` makes compose fail immediately with a readable message when
      # a secret is missing, instead of the app booting and dying on a
      # placeholder-resolution stack trace.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env (see .env.example)}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./eventsphere-frontend
    ports:
      # 3000 on the host -> 80 in the container, where Nginx listens.
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
