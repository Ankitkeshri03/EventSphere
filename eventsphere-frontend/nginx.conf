server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This block is why a custom config is needed at all.
    #
    # React Router is client-side: /dashboard, /my-tickets and /events/3 exist
    # only in JavaScript, not as files on disk. Default Nginx maps a URL to a
    # file, so a refresh or a pasted link to /dashboard looks for
    # /usr/share/nginx/html/dashboard, finds nothing, and returns 404.
    #
    # try_files falls back to index.html when no real file matches, letting the
    # React app boot and resolve the route itself. Only the app's own entry
    # point is served this way -- real files (assets below) still win.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints built assets (app-a1b2c3d4.js), so the filename changes
    # whenever the content does. That makes them safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
